name: TaskFlow CI

on:
  pull_request:
    paths:
      - "taskflow/**"
      - ".github/workflows/taskflow-ci.yml"

permissions:
  contents: read

jobs:
  build:
    name: Check JavaScript syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: taskflow/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: taskflow

      - name: Check syntax
        run: npm run check
        working-directory: taskflow

  test:
    name: Run automated tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: taskflow/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: taskflow

      - name: Run tests
        run: npm test
        working-directory: taskflow